<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0098D6"/>
      <stop offset="1" stop-color="#0a5f8f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="300" cy="260" r="240" fill="url(#bg)"/>

  <!-- Линии обмена -->
  <g fill="none" stroke-width="3" stroke-dasharray="7 7">
    <path d="M300 260 L130 120" stroke="#0098D6"/>
    <path d="M300 260 L470 120" stroke="#22b35e"/>
    <path d="M300 260 L130 400" stroke="#22b35e"/>
    <path d="M300 260 L470 400" stroke="#0098D6"/>
  </g>

  <!-- 1С в центре -->
  <g filter="url(#sh)">
    <circle cx="300" cy="260" r="78" fill="url(#core)"/>
    <circle cx="300" cy="260" r="62" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <text x="300" y="276" font-size="46" font-weight="800" fill="#fff" text-anchor="middle">1С</text>
  </g>

  <!-- Сайт -->
  <g filter="url(#sh)">
    <rect x="45" y="60" width="170" height="120" rx="14" fill="#fff"/>
    <rect x="45" y="60" width="170" height="26" rx="14" fill="#eef3f7"/>
    <rect x="45" y="74" width="170" height="12" fill="#eef3f7"/>
    <circle cx="61" cy="73" r="4" fill="#f14635"/><circle cx="73" cy="73" r="4" fill="#f5b400"/><circle cx="85" cy="73" r="4" fill="#22b35e"/>
    <rect x="60" y="98" width="40" height="34" rx="6" fill="#d6f3ff"/>
    <rect x="110" y="98" width="40" height="34" rx="6" fill="#d6f3ff"/>
    <rect x="160" y="98" width="40" height="34" rx="6" fill="#d6f3ff"/>
    <rect x="60" y="140" width="40" height="8" rx="4" fill="#e3edf3"/>
    <rect x="110" y="140" width="40" height="8" rx="4" fill="#e3edf3"/>
    <rect x="160" y="140" width="40" height="8" rx="4" fill="#e3edf3"/>
    <text x="130" y="168" font-size="12" font-weight="800" fill="#1a1a2e" text-anchor="middle">Сайт</text>
  </g>

  <!-- Kaspi Магазин -->
  <g filter="url(#sh)">
    <rect x="385" y="60" width="170" height="120" rx="14" fill="#fff"/>
    <rect x="405" y="80" width="44" height="44" rx="12" fill="#f14635"/>
    <path d="M417 95 h20 l-3 16 h-14 z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <rect x="460" y="86" width="76" height="9" rx="4.5" fill="#e3edf3"/>
    <rect x="460" y="104" width="56" height="9" rx="4.5" fill="#e3edf3"/>
    <text x="470" y="160" font-size="12" font-weight="800" fill="#1a1a2e" text-anchor="middle">Kaspi Магазин</text>
  </g>

  <!-- Приложение -->
  <g filter="url(#sh)">
    <rect x="85" y="330" width="90" height="150" rx="16" fill="#1a1a2e"/>
    <rect x="92" y="344" width="76" height="122" rx="10" fill="#fff"/>
    <rect x="100" y="356" width="60" height="30" rx="6" fill="#d6f3ff"/>
    <rect x="100" y="394" width="60" height="8" rx="4" fill="#e3edf3"/>
    <rect x="100" y="408" width="44" height="8" rx="4" fill="#e3edf3"/>
    <rect x="100" y="430" width="60" height="22" rx="8" fill="#22b35e"/>
    <text x="130" y="445" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">Заказать</text>
  </g>

  <!-- CRM -->
  <g filter="url(#sh)">
    <rect x="385" y="340" width="170" height="120" rx="14" fill="#fff"/>
    <rect x="400" y="356" width="44" height="64" rx="8" fill="#eef3f7"/>
    <rect x="450" y="356" width="44" height="64" rx="8" fill="#eef3f7"/>
    <rect x="500" y="356" width="40" height="64" rx="8" fill="#eef3f7"/>
    <rect x="406" y="364" width="32" height="14" rx="4" fill="#0098D6"/>
    <rect x="406" y="384" width="32" height="14" rx="4" fill="#0098D6" opacity=".5"/>
    <rect x="456" y="364" width="32" height="14" rx="4" fill="#f5b400"/>
    <rect x="506" y="364" width="28" height="14" rx="4" fill="#22b35e"/>
    <text x="470" y="444" font-size="12" font-weight="800" fill="#1a1a2e" text-anchor="middle">CRM</text>
  </g>

  <!-- Подписи данных -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="175" y="166" width="84" height="24" rx="12" fill="#fff" stroke="#0098D6" stroke-width="2"/>
    <text x="217" y="182" fill="#0098D6">остатки</text>
    <rect x="345" y="166" width="70" height="24" rx="12" fill="#fff" stroke="#22b35e" stroke-width="2"/>
    <text x="380" y="182" fill="#22b35e">заказы</text>
    <rect x="345" y="330" width="70" height="24" rx="12" fill="#fff" stroke="#0098D6" stroke-width="2"/>
    <text x="380" y="346" fill="#0098D6">цены</text>
    <rect x="185" y="330" width="80" height="24" rx="12" fill="#fff" stroke="#22b35e" stroke-width="2"/>
    <text x="225" y="346" fill="#22b35e">оплаты</text>
  </g>
</svg>
