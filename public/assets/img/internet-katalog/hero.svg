<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0098D6"/>
      <stop offset="1" stop-color="#0a5f8f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="300" cy="260" r="240" fill="url(#bg)"/>

  <!-- Окно каталога -->
  <g filter="url(#sh)">
    <rect x="60" y="70" width="440" height="330" rx="14" fill="#fff"/>
  </g>
  <rect x="60" y="70" width="440" height="24" rx="12" fill="#eef3f6"/>
  <rect x="60" y="82" width="440" height="12" fill="#eef3f6"/>
  <circle cx="76" cy="82" r="4" fill="#ff6b6b"/>
  <circle cx="90" cy="82" r="4" fill="#ffc94d"/>
  <circle cx="104" cy="82" r="4" fill="#22b35e"/>

  <!-- Поиск -->
  <rect x="76" y="106" width="408" height="26" rx="13" fill="#f2f7fa"/>
  <circle cx="94" cy="119" r="6" fill="none" stroke="#0098D6" stroke-width="2.5"/>
  <path d="M98 123 L103 128" stroke="#0098D6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="112" y="123" font-size="10" fill="#8aa0ad">Поиск по названию или артикулу</text>

  <!-- Фильтры -->
  <rect x="76" y="144" width="110" height="242" rx="10" fill="#f2f7fa"/>
  <text x="88" y="166" font-size="11" font-weight="700" fill="#1a1a2e">Фильтры</text>
  <g>
    <rect x="88" y="180" width="12" height="12" rx="3" fill="#0098D6"/>
    <path d="M91 186 L94 189 L98 183" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="106" y="183" width="62" height="6" rx="3" fill="#c3d2dc"/>
    <rect x="88" y="202" width="12" height="12" rx="3" fill="none" stroke="#a9bac6" stroke-width="2"/>
    <rect x="106" y="205" width="50" height="6" rx="3" fill="#c3d2dc"/>
    <rect x="88" y="224" width="12" height="12" rx="3" fill="#0098D6"/>
    <path d="M91 230 L94 233 L98 227" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="106" y="227" width="58" height="6" rx="3" fill="#c3d2dc"/>
    <rect x="88" y="246" width="12" height="12" rx="3" fill="none" stroke="#a9bac6" stroke-width="2"/>
    <rect x="106" y="249" width="44" height="6" rx="3" fill="#c3d2dc"/>
    <text x="88" y="282" font-size="10" font-weight="700" fill="#1a1a2e">Цена</text>
    <rect x="88" y="292" width="84" height="4" rx="2" fill="#c3d2dc"/>
    <rect x="104" y="292" width="46" height="4" rx="2" fill="#0098D6"/>
    <circle cx="104" cy="294" r="6" fill="#fff" stroke="#0098D6" stroke-width="2"/>
    <circle cx="150" cy="294" r="6" fill="#fff" stroke="#0098D6" stroke-width="2"/>
  </g>

  <!-- Карточки товаров -->
  <g>
    <rect x="198" y="144" width="88" height="114" rx="10" fill="#f2f7fa"/>
    <rect x="296" y="144" width="88" height="114" rx="10" fill="#f2f7fa"/>
    <rect x="394" y="144" width="88" height="114" rx="10" fill="#f2f7fa"/>
    <rect x="198" y="270" width="88" height="114" rx="10" fill="#f2f7fa"/>
    <rect x="296" y="270" width="88" height="114" rx="10" fill="#f2f7fa"/>
    <rect x="394" y="270" width="88" height="114" rx="10" fill="#f2f7fa"/>
    <g fill="url(#core)">
      <rect x="208" y="154" width="68" height="50" rx="6"/>
      <rect x="306" y="154" width="68" height="50" rx="6"/>
      <rect x="404" y="154" width="68" height="50" rx="6"/>
      <rect x="208" y="280" width="68" height="50" rx="6"/>
      <rect x="306" y="280" width="68" height="50" rx="6"/>
      <rect x="404" y="280" width="68" height="50" rx="6"/>
    </g>
    <g fill="#c3d2dc">
      <rect x="208" y="212" width="58" height="6" rx="3"/>
      <rect x="306" y="212" width="58" height="6" rx="3"/>
      <rect x="404" y="212" width="58" height="6" rx="3"/>
      <rect x="208" y="338" width="58" height="6" rx="3"/>
      <rect x="306" y="338" width="58" height="6" rx="3"/>
      <rect x="404" y="338" width="58" height="6" rx="3"/>
    </g>
    <g fill="#fff" stroke="#0098D6" stroke-width="1.5">
      <rect x="208" y="228" width="68" height="18" rx="9"/>
      <rect x="306" y="228" width="68" height="18" rx="9"/>
      <rect x="404" y="228" width="68" height="18" rx="9"/>
      <rect x="208" y="354" width="68" height="18" rx="9"/>
      <rect x="306" y="354" width="68" height="18" rx="9"/>
      <rect x="404" y="354" width="68" height="18" rx="9"/>
    </g>
    <g font-size="7" font-weight="700" fill="#0098D6" text-anchor="middle">
      <text x="242" y="240">Узнать цену</text>
      <text x="340" y="240">Узнать цену</text>
      <text x="438" y="240">Узнать цену</text>
      <text x="242" y="366">Узнать цену</text>
      <text x="340" y="366">Узнать цену</text>
      <text x="438" y="366">Узнать цену</text>
    </g>
  </g>

  <!-- Карточка заявки -->
  <g filter="url(#sh)">
    <rect x="30" y="410" width="230" height="70" rx="14" fill="#fff"/>
    <circle cx="62" cy="445" r="18" fill="#25D366"/>
    <path d="M53 445 L59.5 451.5 L71 439" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="440" font-size="13" font-weight="700" fill="#1a1a2e">Запрос цены</text>
    <text x="90" y="459" font-size="11" fill="#666">арт. 10245 · 50 шт.</text>
  </g>

  <!-- Импорт -->
  <g filter="url(#sh)">
    <rect x="380" y="410" width="190" height="70" rx="14" fill="#fff"/>
    <rect x="396" y="426" width="36" height="38" rx="6" fill="#22b35e"/>
    <text x="414" y="450" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">X</text>
    <text x="444" y="440" font-size="13" font-weight="700" fill="#1a1a2e">Excel и 1С</text>
    <text x="444" y="459" font-size="11" fill="#666">товары и цены</text>
  </g>
</svg>
