<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0098D6"/>
      <stop offset="1" stop-color="#0a5f8f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="300" cy="260" r="240" fill="url(#bg)"/>

  <!-- Карточка товара -->
  <g filter="url(#sh)">
    <rect x="60" y="70" width="330" height="300" rx="16" fill="#fff"/>
  </g>
  <rect x="80" y="90" width="140" height="150" rx="12" fill="url(#core)"/>
  <rect x="112" y="128" width="76" height="80" rx="10" fill="#fff" fill-opacity=".9"/>
  <path d="M132 144 Q150 128 168 144" fill="none" stroke="#0098D6" stroke-width="4" stroke-linecap="round"/>
  <rect x="80" y="250" width="40" height="34" rx="6" fill="#f2f7fa"/>
  <rect x="130" y="250" width="40" height="34" rx="6" fill="#f2f7fa"/>
  <rect x="180" y="250" width="40" height="34" rx="6" fill="#f2f7fa"/>

  <rect x="238" y="96" width="132" height="10" rx="5" fill="#1a1a2e" fill-opacity=".8"/>
  <rect x="238" y="114" width="96" height="10" rx="5" fill="#1a1a2e" fill-opacity=".8"/>
  <g fill="#ffc94d">
    <path d="M242 140 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z"/>
    <path d="M258 140 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z"/>
    <path d="M274 140 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z"/>
    <path d="M290 140 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z"/>
    <path d="M306 140 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z"/>
  </g>
  <text x="238" y="192" font-size="22" font-weight="800" fill="#1a1a2e">24 990 ₸</text>
  <rect x="238" y="206" width="120" height="6" rx="3" fill="#c3d2dc"/>
  <rect x="238" y="218" width="96" height="6" rx="3" fill="#c3d2dc"/>
  <rect x="238" y="242" width="132" height="34" rx="10" fill="#0098D6"/>
  <text x="304" y="264" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">В корзину</text>
  <rect x="80" y="300" width="290" height="6" rx="3" fill="#e3ebf0"/>
  <rect x="80" y="316" width="250" height="6" rx="3" fill="#e3ebf0"/>
  <rect x="80" y="332" width="270" height="6" rx="3" fill="#e3ebf0"/>

  <!-- Корзина / оформление в телефоне -->
  <g filter="url(#sh)">
    <rect x="405" y="110" width="150" height="290" rx="22" fill="#1a1a2e"/>
    <rect x="415" y="122" width="130" height="266" rx="14" fill="#fff"/>
    <rect x="460" y="128" width="40" height="6" rx="3" fill="#1a1a2e"/>
  </g>
  <text x="428" y="158" font-size="12" font-weight="700" fill="#1a1a2e">Корзина</text>
  <rect x="428" y="168" width="34" height="34" rx="6" fill="url(#core)"/>
  <rect x="470" y="172" width="60" height="6" rx="3" fill="#c3d2dc"/>
  <text x="470" y="196" font-size="10" font-weight="700" fill="#1a1a2e">24 990 ₸</text>
  <rect x="428" y="210" width="34" height="34" rx="6" fill="#5bbde6"/>
  <rect x="470" y="214" width="56" height="6" rx="3" fill="#c3d2dc"/>
  <text x="470" y="238" font-size="10" font-weight="700" fill="#1a1a2e">8 500 ₸</text>
  <rect x="428" y="256" width="104" height="1.5" fill="#e3ebf0"/>
  <text x="428" y="276" font-size="9" fill="#666">Доставка</text>
  <text x="532" y="276" font-size="9" font-weight="700" fill="#22b35e" text-anchor="end">Бесплатно</text>
  <text x="428" y="294" font-size="10" font-weight="700" fill="#1a1a2e">Итого</text>
  <text x="532" y="294" font-size="10" font-weight="800" fill="#1a1a2e" text-anchor="end">33 490 ₸</text>
  <rect x="428" y="308" width="104" height="26" rx="9" fill="#f14635"/>
  <text x="480" y="325" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Kaspi Pay</text>
  <rect x="428" y="342" width="104" height="26" rx="9" fill="#fff" stroke="#0098D6" stroke-width="1.5"/>
  <text x="480" y="359" font-size="10" font-weight="700" fill="#0098D6" text-anchor="middle">Картой</text>

  <!-- Оплачено -->
  <g filter="url(#sh)">
    <rect x="30" y="395" width="230" height="70" rx="14" fill="#fff"/>
    <circle cx="62" cy="430" r="18" fill="#22b35e"/>
    <path d="M53 430 L59.5 436.5 L71 424" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="425" font-size="13" font-weight="700" fill="#1a1a2e">Заказ оплачен</text>
    <text x="90" y="444" font-size="11" fill="#666">№ 1048 · ушёл в 1С</text>
  </g>

  <!-- Доставка -->
  <g filter="url(#sh)">
    <rect x="300" y="420" width="170" height="62" rx="14" fill="#fff"/>
    <rect x="316" y="438" width="30" height="20" rx="3" fill="#0098D6"/>
    <path d="M346 444 H356 L362 451 V458 H346 Z" fill="#0098D6"/>
    <circle cx="324" cy="461" r="4.5" fill="#1a1a2e"/>
    <circle cx="354" cy="461" r="4.5" fill="#1a1a2e"/>
    <text x="374" y="447" font-size="12" font-weight="700" fill="#1a1a2e">Доставка</text>
    <text x="374" y="465" font-size="10" fill="#666">по Казахстану</text>
  </g>
</svg>
