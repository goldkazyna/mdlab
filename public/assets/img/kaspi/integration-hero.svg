<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#0098D6"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#22b35e"/>
    </marker>
  </defs>

  <circle cx="300" cy="270" r="240" fill="url(#bg)"/>

  <!-- Монитор кассовой / учётной системы -->
  <g filter="url(#sh)">
    <rect x="40" y="110" width="270" height="190" rx="14" fill="#fff"/>
    <rect x="40" y="110" width="270" height="34" rx="14" fill="#0098D6"/>
    <rect x="40" y="130" width="270" height="14" fill="#0098D6"/>
    <circle cx="60" cy="127" r="5" fill="#fff" opacity=".8"/>
    <circle cx="76" cy="127" r="5" fill="#fff" opacity=".6"/>
    <circle cx="92" cy="127" r="5" fill="#fff" opacity=".4"/>
    <text x="290" y="132" font-size="13" font-weight="700" fill="#fff" text-anchor="end">Заказ №1048</text>
    <rect x="60" y="162" width="140" height="10" rx="5" fill="#e3edf3"/>
    <rect x="240" y="162" width="50" height="10" rx="5" fill="#e3edf3"/>
    <rect x="60" y="184" width="110" height="10" rx="5" fill="#e3edf3"/>
    <rect x="240" y="184" width="50" height="10" rx="5" fill="#e3edf3"/>
    <rect x="60" y="206" width="125" height="10" rx="5" fill="#e3edf3"/>
    <rect x="240" y="206" width="50" height="10" rx="5" fill="#e3edf3"/>
    <line x1="60" y1="232" x2="290" y2="232" stroke="#e3edf3" stroke-width="2"/>
    <text x="60" y="262" font-size="15" font-weight="600" fill="#666">Итого</text>
    <text x="290" y="264" font-size="22" font-weight="800" fill="#1a1a2e" text-anchor="end">12 500 ₸</text>
    <rect x="60" y="275" width="230" height="0" fill="none"/>
  </g>
  <rect x="150" y="300" width="50" height="34" fill="#c9dbe5"/>
  <rect x="110" y="334" width="130" height="12" rx="6" fill="#c9dbe5"/>
  <text x="175" y="378" font-size="15" font-weight="700" fill="#1a1a2e" text-anchor="middle">1С · iiko · CRM · сайт</text>

  <!-- Сумма уходит на терминал -->
  <path d="M318 175 C 360 160, 380 160, 410 180" fill="none" stroke="#0098D6" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#ar)"/>
  <rect x="322" y="128" width="88" height="26" rx="13" fill="#fff" stroke="#0098D6" stroke-width="2"/>
  <text x="366" y="146" font-size="12" font-weight="700" fill="#0098D6" text-anchor="middle">сумма</text>

  <!-- Результат оплаты обратно -->
  <path d="M410 330 C 380 352, 355 352, 322 330" fill="none" stroke="#22b35e" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#ag)"/>
  <rect x="318" y="356" width="96" height="26" rx="13" fill="#fff" stroke="#22b35e" stroke-width="2"/>
  <text x="366" y="374" font-size="12" font-weight="700" fill="#22b35e" text-anchor="middle">оплачено</text>

  <!-- Платёжный терминал -->
  <g filter="url(#sh)">
    <rect x="420" y="120" width="140" height="250" rx="22" fill="url(#term)"/>
    <rect x="436" y="140" width="108" height="80" rx="10" fill="#f14635"/>
    <text x="490" y="170" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" opacity=".85">К оплате</text>
    <text x="490" y="198" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">12 500 ₸</text>
    <g fill="#3b4050">
      <rect x="440" y="238" width="28" height="20" rx="6"/><rect x="476" y="238" width="28" height="20" rx="6"/><rect x="512" y="238" width="28" height="20" rx="6"/>
      <rect x="440" y="266" width="28" height="20" rx="6"/><rect x="476" y="266" width="28" height="20" rx="6"/><rect x="512" y="266" width="28" height="20" rx="6"/>
      <rect x="440" y="294" width="28" height="20" rx="6"/><rect x="476" y="294" width="28" height="20" rx="6"/><rect x="512" y="294" width="28" height="20" rx="6"/>
    </g>
    <rect x="440" y="324" width="100" height="26" rx="8" fill="#22b35e"/>
    <path d="M478 337 l8 8 l16 -16" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Телефон с QR -->
  <g filter="url(#sh)" transform="rotate(-8 470 430)">
    <rect x="400" y="370" width="92" height="140" rx="16" fill="#1a1a2e"/>
    <rect x="407" y="384" width="78" height="112" rx="10" fill="#fff"/>
    <g fill="#1a1a2e">
      <rect x="418" y="398" width="18" height="18"/><rect x="456" y="398" width="18" height="18"/><rect x="418" y="436" width="18" height="18"/>
      <rect x="440" y="402" width="8" height="8"/><rect x="442" y="420" width="10" height="6"/><rect x="458" y="424" width="6" height="12"/>
      <rect x="444" y="440" width="6" height="14"/><rect x="456" y="444" width="18" height="6"/><rect x="466" y="436" width="8" height="6"/>
      <rect x="426" y="420" width="6" height="8"/>
    </g>
    <g fill="#fff"><rect x="422" y="402" width="10" height="10"/><rect x="460" y="402" width="10" height="10"/><rect x="422" y="440" width="10" height="10"/></g>
    <g fill="#1a1a2e"><rect x="425" y="405" width="4" height="4"/><rect x="463" y="405" width="4" height="4"/><rect x="425" y="443" width="4" height="4"/></g>
    <text x="446" y="480" font-size="11" font-weight="700" fill="#f14635" text-anchor="middle">QR</text>
  </g>
</svg>
