  <rect x="420" y="200" width="120" height="96" fill="url(#hero)"/>
  <rect x="432" y="216" width="84" height="9" rx="4.5" fill="#fff"/>
  <rect x="432" y="231" width="62" height="9" rx="4.5" fill="#fff"/>
  <rect x="432" y="250" width="76" height="5" rx="2.5" fill="#fff" fill-opacity=".6"/>
  <rect x="432" y="260" width="56" height="5" rx="2.5" fill="#fff" fill-opacity=".6"/>
  <rect x="432" y="306" width="96" height="40" rx="8" fill="#f2f7fa"/>
  <rect x="442" y="317" width="60" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="442" y="328" width="44" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="432" y="356" width="96" height="22" rx="11" fill="#25D366"/>
  <text x="480" y="371" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">WhatsApp</text>
  <rect x="432" y="386" width="96" height="22" rx="11" fill="none" stroke="#0098D6" stroke-width="2"/>
  <text x="480" y="401" font-size="9" font-weight="700" fill="#0098D6" text-anchor="middle">Позвонить</text>

  <!-- Карточка заявки -->
  <g filter="url(#sh)">
    <rect x="30" y="392" width="200" height="74" rx="14" fill="#fff"/>
    <circle cx="62" cy="429" r="18" fill="#22b35e"/>
    <path d="M53 429 L59.5 435.5 L71 423" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="423" font-size="14" font-weight="700" fill="#1a1a2e">Новая заявка</text>
    <text x="90" y="443" font-size="11" fill="#666">с рекламы Google Ads</text>
  </g>

  <!-- Метка аналитики -->
  <g filter="url(#sh)">
    <rect x="270" y="30" width="170" height="56" rx="14" fill="#fff"/>
    <rect x="288" y="62" width="10" height="12" rx="2" fill="#a9d9ef"/>
    <rect x="303" y="54" width="10" height="20" rx="2" fill="#5bbde6"/>
    <rect x="318" y="44" width="10" height="30" rx="2" fill="#0098D6"/>
    <text x="342" y="55" font-size="12" font-weight="700" fill="#1a1a2e">Аналитика</text>
    <text x="342" y="72" font-size="10" fill="#666">цели настроены</text>
