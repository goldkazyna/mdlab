<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0098D6"/>
      <stop offset="1" stop-color="#0a5f8f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="300" cy="260" r="240" fill="url(#bg)"/>

  <!-- Ноутбук -->
  <g filter="url(#sh)">
    <rect x="70" y="95" width="380" height="250" rx="16" fill="#1a1a2e"/>
    <rect x="82" y="107" width="356" height="226" rx="6" fill="#fff"/>
    <path d="M40 345 H480 L462 372 H58 Z" fill="#c9d6df"/>
    <rect x="225" y="345" width="70" height="8" rx="4" fill="#a9bac6"/>
  </g>

  <!-- Экран лендинга -->
  <rect x="82" y="107" width="356" height="18" rx="6" fill="#eef3f6"/>
  <circle cx="94" cy="116" r="3.5" fill="#ff6b6b"/>
  <circle cx="106" cy="116" r="3.5" fill="#ffc94d"/>
  <circle cx="118" cy="116" r="3.5" fill="#22b35e"/>

  <rect x="82" y="125" width="356" height="110" fill="url(#hero)"/>
  <rect x="100" y="145" width="150" height="12" rx="6" fill="#fff"/>
  <rect x="100" y="164" width="110" height="12" rx="6" fill="#fff"/>
  <rect x="100" y="186" width="130" height="6" rx="3" fill="#fff" fill-opacity=".6"/>
