  <rect x="290" y="140" width="130" height="82" rx="10" fill="#fff" fill-opacity=".18"/>
  <circle cx="355" cy="181" r="24" fill="#fff" fill-opacity=".85"/>
  <path d="M347 169 L367 181 L347 193 Z" fill="#0098D6"/>

  <g>
    <rect x="100" y="250" width="100" height="66" rx="8" fill="#f2f7fa"/>
    <rect x="210" y="250" width="100" height="66" rx="8" fill="#f2f7fa"/>
    <rect x="320" y="250" width="100" height="66" rx="8" fill="#f2f7fa"/>
    <circle cx="122" cy="270" r="9" fill="#0098D6"/>
    <circle cx="232" cy="270" r="9" fill="#0098D6"/>
    <circle cx="342" cy="270" r="9" fill="#0098D6"/>
    <rect x="112" y="288" width="70" height="6" rx="3" fill="#c3d2dc"/>
    <rect x="112" y="299" width="50" height="6" rx="3" fill="#c3d2dc"/>
    <rect x="222" y="288" width="70" height="6" rx="3" fill="#c3d2dc"/>
    <rect x="222" y="299" width="50" height="6" rx="3" fill="#c3d2dc"/>
    <rect x="332" y="288" width="70" height="6" rx="3" fill="#c3d2dc"/>
    <rect x="332" y="299" width="50" height="6" rx="3" fill="#c3d2dc"/>
  </g>

