  </g>
  <text x="426" y="136" font-size="12" font-weight="700" fill="#1a1a2e">Кампания</text>
  <g font-size="10" fill="#666">
    <text x="426" y="158">Клики</text>
    <text x="426" y="180">CTR</text>
