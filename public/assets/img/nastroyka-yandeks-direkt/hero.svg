  <rect x="311" y="104" width="60" height="30" rx="8" fill="#fc3f1d"/>
  <text x="341" y="123" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Найти</text>

  <!-- Рекламное объявление 1 -->
  <rect x="60" y="154" width="315" height="96" rx="12" fill="#fffaf0" stroke="#ffd36b" stroke-width="1.5"/>
  <rect x="72" y="166" width="54" height="16" rx="8" fill="#1a1a2e" fill-opacity=".08"/>
  <text x="99" y="178" font-size="9" font-weight="700" fill="#1a1a2e" text-anchor="middle">Реклама</text>
  <text x="72" y="200" font-size="13" font-weight="700" fill="#0a5f8f">Ремонт кондиционеров за 1 день</text>
  <text x="72" y="216" font-size="10" fill="#22b35e">cool-service.kz › remont</text>
  <text x="72" y="230" font-size="10" fill="#666">Выезд мастера по Алматы за 1 час</text>
  <g font-size="9" fill="#0a5f8f">
    <text x="72" y="244">Цены</text>
    <text x="106" y="244">Заправка</text>
    <text x="156" y="244">Контакты</text>
  </g>

  <!-- Рекламное объявление 2 -->
  <rect x="60" y="262" width="315" height="74" rx="12" fill="#fff" stroke="#e3ebf0" stroke-width="1.5"/>
  <rect x="72" y="274" width="54" height="16" rx="8" fill="#1a1a2e" fill-opacity=".08"/>
  <text x="99" y="286" font-size="9" font-weight="700" fill="#1a1a2e" text-anchor="middle">Реклама</text>
  <rect x="72" y="298" width="220" height="9" rx="4.5" fill="#0098D6" fill-opacity=".55"/>
  <rect x="72" y="316" width="250" height="7" rx="3.5" fill="#c3d2dc"/>

  <!-- Органические результаты -->
  <g fill="#c3d2dc">
    <rect x="72" y="356" width="240" height="9" rx="4.5" fill="#0098D6" fill-opacity=".3"/>
    <rect x="72" y="374" width="280" height="7" rx="3.5"/>
    <rect x="72" y="388" width="270" height="7" rx="3.5"/>
    <rect x="72" y="412" width="200" height="9" rx="4.5" fill="#0098D6" fill-opacity=".3"/>
    <rect x="72" y="430" width="270" height="7" rx="3.5"/>
  </g>

  <!-- Статистика кампании -->
  <g filter="url(#sh)">
