    <text x="554" y="180">7,8%</text>
    <text x="554" y="202" fill="#22b35e">142</text>
  </g>
  <path d="M426 252 L452 244 L478 246 L504 232 L530 228 L554 216" fill="none" stroke="#fc3f1d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Новая заявка -->
  <g filter="url(#sh)">
    <rect x="330" y="420" width="240" height="64" rx="14" fill="#fff"/>
    <circle cx="362" cy="452" r="18" fill="#22b35e"/>
    <path d="M353 452 L359.5 458.5 L371 446" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="390" y="447" font-size="13" font-weight="700" fill="#1a1a2e">Новая заявка</text>
    <text x="390" y="466" font-size="11" fill="#666">источник: yandex / cpc</text>
