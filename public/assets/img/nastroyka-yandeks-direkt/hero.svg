<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="300" cy="260" r="240" fill="url(#bg)"/>

  <!-- Окно поисковой выдачи -->
  <g filter="url(#sh)">
    <rect x="40" y="50" width="355" height="410" rx="16" fill="#fff"/>
  </g>
  <rect x="40" y="50" width="355" height="34" rx="16" fill="#f6f9fb"/>
  <rect x="40" y="70" width="355" height="14" fill="#f6f9fb"/>
  <circle cx="62" cy="67" r="5" fill="#ff5f57"/>
  <circle cx="78" cy="67" r="5" fill="#febc2e"/>
  <circle cx="94" cy="67" r="5" fill="#28c840"/>

  <!-- Строка поиска -->
  <rect x="60" y="100" width="315" height="38" rx="10" fill="#fff" stroke="#fc3f1d" stroke-width="2"/>
