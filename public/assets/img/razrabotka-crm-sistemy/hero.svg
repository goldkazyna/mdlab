  <g filter="url(#sh)">
    <rect x="330" y="420" width="250" height="64" rx="14" fill="#fff"/>
    <circle cx="362" cy="452" r="18" fill="#22b35e"/>
    <path d="M353 452 L359.5 458.5 L371 446" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="390" y="447" font-size="13" font-weight="700" fill="#1a1a2e">Новая сделка</text>
    <text x="390" y="466" font-size="11" fill="#666">из WhatsApp · менеджер Асель</text>
