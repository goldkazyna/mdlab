<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0098D6"/>
      <stop offset="1" stop-color="#0a5f8f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="300" cy="260" r="240" fill="url(#bg)"/>

  <!-- Брендбук (разворот) -->
  <g filter="url(#sh)">
    <rect x="60" y="70" width="380" height="250" rx="12" fill="#fff"/>
  </g>
  <rect x="249" y="70" width="2" height="250" fill="#e3ebf0"/>
  <!-- Левая страница: логотип -->
  <text x="80" y="100" font-size="10" font-weight="700" fill="#8aa0ad" letter-spacing="1">01 ЛОГОТИП</text>
  <rect x="80" y="114" width="150" height="110" rx="10" fill="url(#core)"/>
  <path d="M128 192 L128 146 L155 172 L182 146 L182 192" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="80" y="234" width="70" height="36" rx="8" fill="#f2f7fa"/>
  <path d="M100 262 L100 244 L115 256 L130 244 L130 262" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="160" y="234" width="70" height="36" rx="8" fill="#1a1a2e"/>
  <path d="M180 262 L180 244 L195 256 L210 244 L210 262" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="80" y="282" width="120" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="80" y="294" width="90" height="5" rx="2.5" fill="#c3d2dc"/>
  <!-- Правая страница: цвета и шрифты -->
  <text x="270" y="100" font-size="10" font-weight="700" fill="#8aa0ad" letter-spacing="1">02 ЦВЕТА</text>
  <rect x="270" y="114" width="44" height="60" rx="8" fill="#0098D6"/>
  <rect x="320" y="114" width="44" height="60" rx="8" fill="#22b35e"/>
  <rect x="370" y="114" width="50" height="60" rx="8" fill="#1a1a2e"/>
  <g font-size="7" fill="#666">
    <text x="270" y="186">#0098D6</text>
    <text x="320" y="186">#22B35E</text>
    <text x="370" y="186">#1A1A2E</text>
  </g>
  <text x="270" y="214" font-size="10" font-weight="700" fill="#8aa0ad" letter-spacing="1">03 ШРИФТЫ</text>
  <text x="270" y="256" font-size="38" font-weight="800" fill="#1a1a2e">Aa</text>
  <text x="336" y="246" font-size="11" font-weight="700" fill="#1a1a2e">Заголовок</text>
  <text x="336" y="262" font-size="10" fill="#666">Основной текст</text>
  <rect x="270" y="282" width="150" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="270" y="294" width="110" height="5" rx="2.5" fill="#c3d2dc"/>

  <!-- Визитки -->
  <g filter="url(#sh)">
    <g transform="rotate(-8 140 420)">
      <rect x="40" y="370" width="190" height="108" rx="10" fill="#1a1a2e"/>
      <path d="M70 440 L70 408 L88 424 L106 408 L106 440" fill="none" stroke="#0098D6" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="124" y="412" width="80" height="7" rx="3.5" fill="#fff"/>
      <rect x="124" y="426" width="56" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
    </g>
    <rect x="200" y="380" width="190" height="108" rx="10" fill="#fff"/>
  </g>
  <rect x="200" y="380" width="190" height="10" rx="5" fill="#0098D6"/>
  <rect x="200" y="385" width="190" height="5" fill="#0098D6"/>
  <rect x="218" y="410" width="100" height="9" rx="4.5" fill="#1a1a2e"/>
  <rect x="218" y="426" width="70" height="6" rx="3" fill="#c3d2dc"/>
  <rect x="218" y="452" width="110" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="218" y="464" width="90" height="5" rx="2.5" fill="#c3d2dc"/>
  <circle cx="362" cy="458" r="12" fill="#22b35e"/>

  <!-- Соцсети и пакет -->
  <g filter="url(#sh)">
    <rect x="455" y="110" width="120" height="200" rx="18" fill="#1a1a2e"/>
    <rect x="463" y="120" width="104" height="180" rx="12" fill="#fff"/>
  </g>
  <circle cx="485" cy="144" r="13" fill="url(#core)"/>
  <rect x="504" y="138" width="48" height="6" rx="3" fill="#1a1a2e"/>
  <rect x="504" y="148" width="32" height="5" rx="2.5" fill="#c3d2dc"/>
  <g>
    <rect x="471" y="166" width="30" height="30" rx="4" fill="#0098D6"/>
    <rect x="503" y="166" width="30" height="30" rx="4" fill="#d6f3ff"/>
    <rect x="535" y="166" width="24" height="30" rx="4" fill="#22b35e"/>
    <rect x="471" y="198" width="30" height="30" rx="4" fill="#d6f3ff"/>
    <rect x="503" y="198" width="30" height="30" rx="4" fill="#1a1a2e"/>
    <rect x="535" y="198" width="24" height="30" rx="4" fill="#0098D6"/>
    <rect x="471" y="230" width="30" height="30" rx="4" fill="#22b35e"/>
    <rect x="503" y="230" width="30" height="30" rx="4" fill="#0098D6"/>
    <rect x="535" y="230" width="24" height="30" rx="4" fill="#d6f3ff"/>
  </g>

  <g filter="url(#sh)">
    <path d="M420 350 H560 L550 480 H430 Z" fill="url(#core)"/>
  </g>
  <path d="M460 350 Q460 320 490 320 Q520 320 520 350" fill="none" stroke="#1a1a2e" stroke-width="5"/>
  <path d="M466 432 L466 400 L490 422 L514 400 L514 432" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
