<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0098D6"/>
      <stop offset="1" stop-color="#0a5f8f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="300" cy="260" r="240" fill="url(#bg)"/>

  <!-- Монтажная область с построением знака -->
  <g filter="url(#sh)">
    <rect x="130" y="60" width="300" height="300" rx="16" fill="#fff"/>
  </g>
  <g stroke="#e3ebf0" stroke-width="1">
    <path d="M155 110 H405 M155 160 H405 M155 210 H405 M155 260 H405 M155 310 H405"/>
    <path d="M180 85 V335 M230 85 V335 M280 85 V335 M330 85 V335 M380 85 V335"/>
  </g>
  <circle cx="280" cy="190" r="86" fill="none" stroke="#0098D6" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity=".6"/>
  <circle cx="246" cy="190" r="52" fill="none" stroke="#0098D6" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity=".6"/>
  <circle cx="314" cy="190" r="52" fill="none" stroke="#0098D6" stroke-width="1.2" stroke-dasharray="4 4" stroke-opacity=".6"/>

  <!-- Знак -->
  <path d="M220 236 L220 150 L280 206 L340 150 L340 236" fill="none" stroke="url(#core)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="280" cy="140" r="14" fill="#22b35e"/>

  <!-- Опорные точки -->
  <g fill="#fff" stroke="#f14635" stroke-width="1.5">
    <rect x="216" y="146" width="8" height="8"/>
    <rect x="276" y="202" width="8" height="8"/>
    <rect x="336" y="146" width="8" height="8"/>
  </g>
  <text x="280" y="300" font-size="26" font-weight="800" fill="#1a1a2e" text-anchor="middle" letter-spacing="4">BRAND</text>
  <rect x="236" y="314" width="88" height="5" rx="2.5" fill="#c3d2dc"/>

  <!-- Перо -->
  <g transform="translate(440 70) rotate(35)">
    <rect x="0" y="0" width="22" height="120" rx="6" fill="#1a1a2e"/>
    <path d="M0 120 L11 150 L22 120 Z" fill="#0098D6"/>
    <circle cx="11" cy="136" r="2.5" fill="#fff"/>
  </g>

  <!-- Концепции -->
  <g filter="url(#sh)">
    <rect x="30" y="380" width="120" height="96" rx="14" fill="#fff"/>
    <rect x="160" y="380" width="120" height="96" rx="14" fill="#fff"/>
    <rect x="290" y="380" width="120" height="96" rx="14" fill="#0098D6"/>
  </g>
  <circle cx="90" cy="420" r="20" fill="none" stroke="#1a1a2e" stroke-width="7"/>
  <rect x="62" y="452" width="56" height="5" rx="2.5" fill="#c3d2dc"/>
  <path d="M200 438 L220 402 L240 438 Z" fill="#22b35e"/>
  <rect x="192" y="452" width="56" height="5" rx="2.5" fill="#c3d2dc"/>
  <path d="M328 436 L328 408 L350 426 L372 408 L372 436" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="322" y="452" width="56" height="5" rx="2.5" fill="#fff" fill-opacity=".7"/>
  <circle cx="400" cy="390" r="14" fill="#22b35e" stroke="#fff" stroke-width="3"/>
  <path d="M393 390 L398 395 L407 385" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Форматы файлов -->
  <g filter="url(#sh)">
    <rect x="430" y="290" width="140" height="120" rx="14" fill="#fff"/>
    <text x="446" y="314" font-size="12" font-weight="700" fill="#1a1a2e">Файлы</text>
    <rect x="446" y="326" width="50" height="22" rx="6" fill="#f2f7fa"/>
    <text x="471" y="341" font-size="10" font-weight="700" fill="#0098D6" text-anchor="middle">AI</text>
    <rect x="504" y="326" width="50" height="22" rx="6" fill="#f2f7fa"/>
    <text x="529" y="341" font-size="10" font-weight="700" fill="#0098D6" text-anchor="middle">SVG</text>
    <rect x="446" y="356" width="50" height="22" rx="6" fill="#f2f7fa"/>
    <text x="471" y="371" font-size="10" font-weight="700" fill="#0098D6" text-anchor="middle">PDF</text>
    <rect x="504" y="356" width="50" height="22" rx="6" fill="#f2f7fa"/>
    <text x="529" y="371" font-size="10" font-weight="700" fill="#0098D6" text-anchor="middle">PNG</text>
    <text x="446" y="398" font-size="10" fill="#666">+ права на логотип</text>
  </g>
</svg>
