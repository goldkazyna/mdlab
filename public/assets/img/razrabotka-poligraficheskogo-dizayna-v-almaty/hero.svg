<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0098D6"/>
      <stop offset="1" stop-color="#0a5f8f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="300" cy="260" r="240" fill="url(#bg)"/>

  <!-- Каталог (обложка) -->
  <g filter="url(#sh)">
    <g transform="rotate(-6 170 220)">
      <rect x="70" y="70" width="200" height="280" rx="8" fill="url(#core)"/>
      <rect x="92" y="96" width="34" height="34" rx="8" fill="#fff"/>
      <text x="92" y="186" font-size="26" font-weight="800" fill="#fff">КАТАЛОГ</text>
      <text x="92" y="210" font-size="13" font-weight="600" fill="#fff" fill-opacity=".8">продукции 2026</text>
      <rect x="92" y="240" width="156" height="86" rx="8" fill="#fff" fill-opacity=".18"/>
      <circle cx="170" cy="283" r="26" fill="#fff" fill-opacity=".35"/>
    </g>
  </g>

  <!-- Евробуклет -->
  <g filter="url(#sh)">
    <path d="M250 110 L330 96 L330 330 L250 344 Z" fill="#fff"/>
    <path d="M330 96 L410 110 L410 344 L330 330 Z" fill="#f6f9fb"/>
    <path d="M410 110 L490 96 L490 330 L410 344 Z" fill="#fff"/>
  </g>
  <rect x="262" y="128" width="56" height="52" rx="6" fill="#22b35e"/>
  <rect x="262" y="192" width="56" height="6" rx="3" fill="#1a1a2e"/>
  <rect x="262" y="204" width="44" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="262" y="214" width="50" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="262" y="224" width="40" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="342" y="130" width="56" height="6" rx="3" fill="#1a1a2e"/>
  <g fill="#c3d2dc">
    <rect x="342" y="144" width="52" height="5" rx="2.5"/>
    <rect x="342" y="154" width="46" height="5" rx="2.5"/>
    <rect x="342" y="164" width="52" height="5" rx="2.5"/>
  </g>
  <rect x="342" y="182" width="56" height="44" rx="6" fill="#0098D6" fill-opacity=".2"/>
  <rect x="422" y="128" width="56" height="70" rx="6" fill="url(#core)"/>
  <rect x="422" y="210" width="50" height="6" rx="3" fill="#1a1a2e"/>
  <rect x="422" y="222" width="40" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="422" y="290" width="56" height="16" rx="8" fill="#22b35e"/>

  <!-- Визитки стопкой -->
  <g filter="url(#sh)">
    <rect x="44" y="388" width="170" height="96" rx="8" fill="#1a1a2e" transform="rotate(6 129 436)"/>
    <rect x="36" y="380" width="170" height="96" rx="8" fill="#fff"/>
  </g>
  <rect x="54" y="400" width="26" height="26" rx="6" fill="#0098D6"/>
  <rect x="90" y="404" width="86" height="8" rx="4" fill="#1a1a2e"/>
  <rect x="90" y="418" width="58" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="54" y="444" width="100" height="5" rx="2.5" fill="#c3d2dc"/>
  <rect x="54" y="456" width="80" height="5" rx="2.5" fill="#c3d2dc"/>

  <!-- Метки CMYK и обрез -->
  <g filter="url(#sh)">
    <rect x="250" y="380" width="190" height="96" rx="14" fill="#fff"/>
  </g>
  <text x="268" y="406" font-size="12" font-weight="700" fill="#1a1a2e">Готово к печати</text>
  <circle cx="280" cy="436" r="11" fill="#00aeef"/>
  <circle cx="306" cy="436" r="11" fill="#ec008c"/>
  <circle cx="332" cy="436" r="11" fill="#ffe600"/>
  <circle cx="358" cy="436" r="11" fill="#1a1a2e"/>
  <text x="268" y="466" font-size="10" fill="#666">CMYK · 300 dpi · вылеты</text>

  <!-- Листовка -->
  <g filter="url(#sh)">
    <g transform="rotate(8 520 400)">
      <rect x="470" y="330" width="100" height="140" rx="6" fill="#fff"/>
      <rect x="480" y="342" width="80" height="50" rx="4" fill="#f14635"/>
      <text x="520" y="374" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">-30%</text>
      <rect x="480" y="402" width="70" height="6" rx="3" fill="#1a1a2e"/>
      <rect x="480" y="414" width="56" height="5" rx="2.5" fill="#c3d2dc"/>
      <rect x="480" y="444" width="80" height="14" rx="7" fill="#0098D6"/>
    </g>
  </g>
  <!-- Метки обреза -->
  <g stroke="#1a1a2e" stroke-width="1.5" stroke-opacity=".5">
    <path d="M500 60 V80 M490 70 H510"/>
    <circle cx="500" cy="70" r="5" fill="none"/>
  </g>
</svg>
