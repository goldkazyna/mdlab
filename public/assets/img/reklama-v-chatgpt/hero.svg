<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Montserrat, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0098D6"/>
      <stop offset="1" stop-color="#0a5f8f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0098D6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="300" cy="260" r="240" fill="url(#bg)"/>

  <!-- Окно чата -->
  <g filter="url(#sh)">
    <rect x="60" y="50" width="380" height="400" rx="16" fill="#fff"/>
  </g>
  <rect x="60" y="50" width="380" height="44" rx="16" fill="#f6f9fb"/>
  <rect x="60" y="78" width="380" height="16" fill="#f6f9fb"/>
  <circle cx="86" cy="72" r="11" fill="#1a1a2e"/>
  <path d="M81 72 a5 5 0 1 1 10 0 a5 5 0 1 1 -10 0" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="104" y="67" width="80" height="9" rx="4.5" fill="#1a1a2e" fill-opacity=".8"/>

  <!-- Вопрос пользователя -->
  <rect x="200" y="110" width="220" height="50" rx="16" fill="#eef3f6"/>
  <text x="214" y="131" font-size="11" fill="#1a1a2e">Какой кондиционер выбрать</text>
  <text x="214" y="148" font-size="11" fill="#1a1a2e">для квартиры в Алматы?</text>

  <!-- Ответ -->
  <circle cx="88" cy="186" r="10" fill="#1a1a2e"/>
  <g fill="#c3d2dc">
    <rect x="108" y="178" width="300" height="7" rx="3.5"/>
    <rect x="108" y="192" width="270" height="7" rx="3.5"/>
    <rect x="108" y="206" width="290" height="7" rx="3.5"/>
    <rect x="108" y="220" width="200" height="7" rx="3.5"/>
    <rect x="108" y="240" width="280" height="7" rx="3.5"/>
    <rect x="108" y="254" width="240" height="7" rx="3.5"/>
  </g>

  <!-- Рекламный блок под ответом -->
  <rect x="104" y="280" width="316" height="112" rx="14" fill="#fff" stroke="#0098D6" stroke-width="2"/>
  <rect x="116" y="292" width="56" height="18" rx="9" fill="#0098D6" fill-opacity=".12"/>
  <text x="144" y="305" font-size="10" font-weight="700" fill="#0098D6" text-anchor="middle">Реклама</text>
  <rect x="116" y="318" width="62" height="62" rx="10" fill="url(#core)"/>
  <rect x="128" y="336" width="38" height="18" rx="4" fill="#fff" fill-opacity=".9"/>
  <path d="M132 362 h30" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-opacity=".7"/>
  <text x="190" y="332" font-size="12" font-weight="700" fill="#1a1a2e">Кондиционеры с монтажом</text>
  <text x="190" y="349" font-size="10" fill="#666">Подбор по площади, установка</text>
  <text x="190" y="363" font-size="10" fill="#666">за 1 день, гарантия 3 года</text>
  <rect x="330" y="356" width="78" height="24" rx="12" fill="#22b35e"/>
  <text x="369" y="372" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">На сайт</text>

  <!-- Поле ввода -->
  <rect x="80" y="408" width="340" height="28" rx="14" fill="#f2f7fa"/>
  <circle cx="404" cy="422" r="10" fill="#1a1a2e"/>
  <path d="M404 427 V417 M399 421 L404 416 L409 421" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Статистика кампании -->
  <g filter="url(#sh)">
    <rect x="410" y="120" width="160" height="150" rx="14" fill="#fff"/>
  </g>
  <text x="426" y="146" font-size="12" font-weight="700" fill="#1a1a2e">Кампания</text>
  <g font-size="10" fill="#666">
    <text x="426" y="168">Клики</text>
    <text x="426" y="190">CTR</text>
    <text x="426" y="212">Заявки</text>
  </g>
  <g font-size="11" font-weight="700" fill="#1a1a2e" text-anchor="end">
    <text x="554" y="168">1 248</text>
    <text x="554" y="190">4,2%</text>
    <text x="554" y="212" fill="#22b35e">87</text>
  </g>
  <path d="M426 252 L452 240 L478 244 L504 230 L530 226 L554 214" fill="none" stroke="#0098D6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Новая заявка -->
  <g filter="url(#sh)">
    <rect x="330" y="420" width="240" height="64" rx="14" fill="#fff"/>
    <circle cx="362" cy="452" r="18" fill="#22b35e"/>
    <path d="M353 452 L359.5 458.5 L371 446" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="390" y="447" font-size="13" font-weight="700" fill="#1a1a2e">Новая заявка</text>
    <text x="390" y="466" font-size="11" fill="#666">источник: chatgpt / cpc</text>
  </g>
</svg>
